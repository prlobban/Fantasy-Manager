[project]
name = "fantasy-manager"
version = "0.1.0"
description = "ESPN Fantasy Football draft + season manager. Deterministic core, LLM agent on top."
requires-python = ">=3.12"
dependencies = [
    "espn-api>=0.45.0",     # ESPN read client. READ-ONLY — it has no POST methods.
    "nflreadpy>=0.2.0",     # nflverse loaders. Replaces the archived nfl_data_py.
    "polars>=1.0",          # nflreadpy returns polars
    "playwright>=1.47",     # the only write path that exists
    "pydantic>=2.8",        # schemas for everything crossing a boundary
    "pyyaml>=6.0",          # priors.yaml
    "httpx>=0.27",          # ADP, Vegas, news
    "mcp>=1.2",             # core exposed to the agent
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits the real ESPN API; needs cookies. Deselect with -m 'not live'.",
    "browser: drives a real browser. Slow. Deselect with -m 'not browser'.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
