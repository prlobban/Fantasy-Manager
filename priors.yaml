# Every [v1 prior] from docs/fantasy-playbook.md, in one place.
#
# These are STARTING WEIGHTS, not truths. They were chosen to be reasonable, not
# proven. §7 is the loop that moves them, and §7.4 says a confirmed bias updates
# the number HERE and nowhere else. Nothing may hardcode any of these values.
#
# Each key cites the section it implements. If you change one, date it in
# docs/operating-log-2026-season.md and say why in that week's history file.

model:
  # §2.4 — a tier ends where the drop to the next player exceeds this multiple
  # of the median gap inside the tier.
  tier_break_gap_multiple: 1.5

  # §2.5 — hard veto: suspended past this week is undraftable.
  suspension_veto_after_week: 6

  # §2.7 — weather only matters for outdoor games from this week on.
  weather_from_week: 12

  # Agent's pre-draft news pass may move a player's value by at most ±this
  # fraction. Bounds the one place a model touches the board (§3.2, predraft).
  override_cap: 0.15

  # §2.2b — how much of ESPN's published consensus draft board to mix into our
  # own projection. 0.0 is our model alone, 1.0 is consensus alone. Measured on
  # the autopick benchmark (docs/draft-optimization-plan.md): mean finish went
  # 6.80 -> 3.65 of 10 and 13/40 -> 28/40 against ESPN autodraft, improving all
  # four blocks. Flat between 0.5 and 0.9, so this is a plateau not a spike.
  market_blend: 0.75
  # PPR, because this league scores 0.5 a reception — and it measured better
  # than STANDARD (3.65 vs 4.22).
  market_rank_type: PPR
  # How the consensus rank is mapped onto our points scale. 1 builds one
  # ladder per position from ESPN's order WITHIN the position (the 3rd-ranked
  # TE is worth our 3rd-best TE's points); 0 uses one cross-position ladder,
  # which handed a TE ranked 42nd overall a running back's 42nd-place points
  # and drafted Colston Loveland in round 3 (docs/draft-post-mortem-2026.md).
  # Measured on the autopick benchmark, 2026-09-05 — see the post-mortem.
  market_blend_by_position: 0

  # §2.3 / D6 — points per week that streaming adds to replacement level at a
  # ONE-starter position. The rank-N+1 baseline is one player's average; a
  # manager streams the best matchup off the wire each week, and the max over
  # a handful of free agents beats any one of their averages. Without this the
  # engine drafted a QB 12th overall and a rookie TE 29th (2026-09-05). Swept on
  # the autopick benchmark — see docs/draft-post-mortem-2026.md.
  streaming_bonus_per_week:
    QB: 0.0
    TE: 0.0
    K: 0.0
    DST: 0.0

  # §P — our own opportunity-based projection (core/proj), blended into the
  # board the same way the consensus board is. 0.0 = inert: the model is built,
  # fitted and measured, but the live board is exactly what it was until this
  # clears the all-blocks gate in docs/projection-model-plan.md §1.
  projection_blend: 0.0
  projection_model: data/proj-model.json

draft:
  # §3.3 — how many players to keep in the live ESPN queue at all times.
  queue_depth: 8

  # §3.6 — a positional run is on when this many of the last N picks are one position.
  run_detect_count: 3
  run_detect_window: 5

  # §3.7 — never take K or D/ST before the final N rounds.
  no_kicker_dst_until_last_n_rounds: 2

  # §3.5/§3.6 — the picker's bonus weights, each a share of the player's own
  # VOR. These lived as literals inside picker.py until the backtest needed to
  # sweep them: a coefficient that cannot be varied cannot be shown to be
  # right. Swept by scripts/optimize.py — do not retune these by feel.
  scarcity_weight: 0.35        # cost of waiting at this position
  tier_break_weight: 0.12      # per player missing from a 3-deep top tier
  room_demand_per_team: 0.02   # per team ahead of us that needs this position
  room_demand_cap: 0.10
  run_join_weight: 0.06        # a run is on and we get in front of it
  run_wait_weight: 0.04        # a position the room is skipping; wait on it
  # §3.7 — a starter sharing a bye with one we already have. Costs ONE week
  # of the gap to his bench cover, not a share of his season; the 0.08 this
  # replaced was ~4x too steep and never fired until the benchmark supplied
  # real bye weeks.
  bye_collision_weight: 0.02

  # §3.4 — how much of the positional replacement baseline VOR removes stays
  # removed. points = vor + replacement, so 1.0 is a pure-VOR board and 0.0 is
  # a raw-projection board, with everything in between available. Swept by
  # scripts/optimize.py against the autopick benchmark.
  vor_weight: 1.0

  # §3.7 — how much a player's VOR counts AGAIN toward filling an empty
  # starting slot. Never scaled by raw points: that reintroduces the
  # cross-position bias VOR exists to remove (2026-09-04).
  hole_weight: 0.15

  # §3.7 — season points charged per extra bench body at a position, beyond
  # its starters (plus the flex, for RB/WR only).
  stack_penalty: 25.0

  # §3.7 — season points forgone by spending a pick on bench depth while a
  # starting slot is still empty.
  #
  # Set to 0 on 2026-09-04: it is the ONE parameter that improved all four
  # benchmark blocks, and it did so against two different baselines (before and
  # after the §2.2b consensus blend), which is why it survived the anti-overfit
  # gate when nothing else did. Mechanism: it is an ABSOLUTE points charge on a
  # score that is VOR-scaled, so in the late rounds — where every VOR is within
  # +/-20 — a 25-point charge dominates the pick entirely. Position limits
  # already stop the stacking this was written to prevent, so it was doing that
  # job twice and the second time badly.
  bench_opportunity_cost: 0.0

  # Board is stale if older than this (hours) at draft time.
  board_max_age_hours: 3

research:
  # §3.2 — ADP-ordered players to research. Not "everyone reachable" (~170 at
  # our slot): research where the decision is expensive. Picks 4-57 are rounds
  # 1-6 and the pool in reach there is ADP 1-90. Rounds 7-13 are bench flyers
  # and a kicker, where §3.7 already forbids the only genuinely bad move.
  pool_size: 80

  # Parallel `claude -p` processes. Measured 2026-09-04: 27.6s median per
  # dossier, so 80 players is ~6 min at 6 workers. Lower it if the plan's rate
  # limit is unknown — the pass resumes, so a limit hit costs a wait, not a
  # restart.
  workers: 6

  # A dossier older than this is ignored at board build. One night plus the
  # morning, no more: a stale dossier is worse than none, because it reads as
  # current.
  max_age_hours: 30

  # The post-order-lock refresh, by current VOR.
  refresh_top: 15

judge:
  # §3.10 — Pearce's gate, 2026-09-04. The budget is the SMALLER of this and
  # the observed pace, because opponents do not use their clock: 7 picks at 90s
  # is 10.5 min, but 7 picks at 20s is 2.3 min.
  max_budget_s: 300
  # Below this, skip the turn and let the math draft. A judge run that cannot
  # finish is a judge run that spends tokens for nothing.
  min_budget_s: 60
  # Fraction of (picks_until_next x observed pace) we allow ourselves.
  pace_safety: 0.5
  # Room picks the observed-pace median is taken over.
  pace_window: 8
  # The levers, hard-capped in code (core/draft/verdict.py).
  max_vetoes_per_turn: 2
  max_reorders_per_turn: 2
  # Top-N of the PickPlan the judge may act on. Anything outside is invisible.
  candidates: 15

lineup:
  # §4.2 — projected margin thresholds that switch us to floor / ceiling.
  floor_margin_pts: 12
  ceiling_margin_pts: 12
  # How much projected value we'll give up to buy the preferred variance.
  floor_max_points_sacrificed: 1.5
  ceiling_max_points_sacrificed: 2.0
  # §4.3 — bench anyone without a confirmed status this close to kickoff (minutes).
  unconfirmed_status_bench_minutes: 90

  # §4.6 — the flex is filled from these positions first; a TE only when no
  # startable RB/WR remains. (Pearce, 2026-09-06, after Kelce was put in the
  # flex over a WR on a 0.08-point edge.)
  flex_prefers: [RB, WR]

  # §4.7 — studs start. A player whose ROS VOR is at least `stud_ros_gap`
  # above the weekly-best alternative starts unless the weekly projection gap
  # exceeds `stud_bench_margin`. Josh Allen (ROS VOR +73.9) was benched for
  # Herbert (-8.5) on a 0.9-point weekly edge; the weekly number's error bar
  # is ~6 points at QB, the ROS number is the one with signal. 8.0 means a
  # healthy stud is, in practice, never benched on projection.
  stud_bench_margin: 8.0
  stud_ros_gap: 20.0

waivers:
  # This league is ROLLING PRIORITY, not FAAB (read from mSettings 2026-09-03:
  # WAIVERS_TRADITIONAL, isUsingAcquisitionBudget: False). §5.3.
  #
  # §5.3.1 — the bar a claim must clear, by the priority position we hold.
  # Units are projected points per week of improvement to a STARTING slot.
  priority_ladder:
    top:                       # positions 1-3
      max_position: 3
      min_weekly_gain: 3.0
    middle:                    # positions 4-7
      max_position: 7
      min_weekly_gain: 1.5
    bottom:                    # positions 8+
      max_position: 99
      min_weekly_gain: 0.1

  # §5.3.3 — never spend a claim this good on a one-week streamer.
  streamer_priority_floor: 3

  # §5.5 — never drop a top-N player by ROS VOR. Enforced in the add_drop
  # tool — the one waiver rule that is a refusal rather than a flag (D9).
  never_drop_top_n: 5

  # D9 — how many candidates the agent sees, with flags attached: the best by
  # this week's starting-lineup gain, plus the best stashes by ROS value.
  candidates_shown: 20
  upside_shown: 8
  # §5.5 — keep an injured player if he returns within this many weeks
  # AND a bench spot exists. With 4 bench spots it often will not.
  keep_injured_return_within_weeks: 4

  # If this league is ever switched to FAAB, write a ladder here and delete
  # priority_ladder. Do NOT run one system's numbers through the other.
  faab_ladder: null

trades:
  # §6.1 — outgoing rate limits.
  max_proposals_per_day: 1
  max_proposals_per_week: 3
  max_open_offers_per_manager: 1
  no_repropose_days: 14
  # §6.5 — never trade a top-N asset for a package of lesser parts.
  protected_top_n: 3

  # D9 — the group-chat test as a number. Market value (core.model.market,
  # from ADP decaying into ROS rank) they RECEIVE over what they GIVE. Below
  # this an offer reads as a lowball and propose_trade refuses it; above it
  # the agent's `why_they_accept` carries the offer. Our model's read of their
  # lineup gain is advisory only — it graded Pitts-for-Irving as good for them.
  min_market_ratio: 0.8
  # Weeks over which ADP stops being the market and the ROS rank takes over.
  market_adp_decay_weeks: 8
  # Their best N by ROS VOR considered as targets, per team.
  gettables_per_team: 8

  # §6.8 — the anti-fleece gauntlet on INCOMING offers.
  gauntlet:
    # §6.8.1 — minimum gain in projected ROS starting-lineup points.
    min_starting_points_gain: 8
    # §6.8.4 — an offer this soon after news on any involved player is
    # presumed information arbitrage.
    news_window_hours: 48
    # §6.8.6 — on a 1-for-many, the best incoming player must be within this
    # fraction of the outgoing player's ROS VOR.
    consolidation_tolerance: 0.10
    # §6.8.9 — never accept sooner than this after receipt (minutes).
    cooldown_minutes: 60
    # §6.8.10 — caps.
    max_accepts_per_week: 1
    same_manager_cooldown_days: 14

# ── in-season additions, 2026-09-05 (Pearce's post-draft brief) ──────────────
season:
  # §5.7 — roster adds (waiver claims + free-agent adds) per rolling 7 days.
  # Pearce, 09-05: "three a week max, so it is forced to actually think."
  max_adds_per_week: 3

  # D4.5 — a droppable player with at least this much ROS VOR is trade
  # capital, not a drop. The sweep must try a trade first unless the add is
  # urgent.
  trade_instead_of_drop_min_vor: 5.0
  # ...unless the add gains at least this many starting points a week; then
  # the drop is justified outright.
  urgent_add_weekly_gain: 4.0

  # The weekly research multiplier (D1.4) may move THIS WEEK's projection this
  # far. Wider than the ROS cap because a practice report or a snap-share jump
  # is a bigger, shorter-lived signal than a role change.
  week_override_cap: 0.25

research_week:
  # Who gets a dossier every morning: everyone rostered, plus the top waiver
  # candidates by weekly gain and the trade targets core surfaced.
  waiver_candidates: 10
  trade_targets: 6
  # D9 — the agent may research a player itself mid-sweep (research_player)
  # when it wants to know about someone the morning pass skipped. Capped per
  # run: each is a full web pass (~$0.25, ~40s).
  on_demand_max: 6
  # A weekly dossier older than this is ignored. A practice report is a
  # same-day fact.
  max_age_hours: 20
  workers: 6
