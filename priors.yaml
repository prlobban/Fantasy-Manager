# Every [v1 prior] from docs/fantasy-playbook.md, in one place.
#
# These are STARTING WEIGHTS, not truths. They were chosen to be reasonable, not
# proven. §7 is the loop that moves them, and §7.4 says a confirmed bias updates
# the number HERE and nowhere else. Nothing may hardcode any of these values.
#
# Each key cites the section it implements. If you change one, date it in
# docs/operating-log-2026-season.md and say why in that week's history file.

model:
  # §2.4 — a tier ends where the drop to the next player exceeds this multiple
  # of the median gap inside the tier.
  tier_break_gap_multiple: 1.5

  # §2.5 — hard veto: suspended past this week is undraftable.
  suspension_veto_after_week: 6

  # §2.7 — weather only matters for outdoor games from this week on.
  weather_from_week: 12

  # Agent's pre-draft news pass may move a player's value by at most ±this
  # fraction. Bounds the one place a model touches the board (§3.2, predraft).
  override_cap: 0.15

draft:
  # §3.3 — how many players to keep in the live ESPN queue at all times.
  queue_depth: 8

  # §3.6 — a positional run is on when this many of the last N picks are one position.
  run_detect_count: 3
  run_detect_window: 5

  # §3.7 — never take K or D/ST before the final N rounds.
  no_kicker_dst_until_last_n_rounds: 2

  # §3.5/§3.6 — the picker's bonus weights, each a share of the player's own
  # VOR. These lived as literals inside picker.py until the backtest needed to
  # sweep them: a coefficient that cannot be varied cannot be shown to be
  # right. Swept by scripts/backtest_tune.py — do not retune these by feel.
  scarcity_weight: 0.35        # cost of waiting at this position
  tier_break_weight: 0.12      # per player missing from a 3-deep top tier
  room_demand_per_team: 0.02   # per team ahead of us that needs this position
  room_demand_cap: 0.10
  run_join_weight: 0.06        # a run is on and we get in front of it
  run_wait_weight: 0.04        # a position the room is skipping; wait on it

  # §3.7 — how much a player's VOR counts AGAIN toward filling an empty
  # starting slot. Never scaled by raw points: that reintroduces the
  # cross-position bias VOR exists to remove (2026-09-04).
  hole_weight: 0.15

  # §3.7 — season points charged per extra bench body at a position, beyond
  # its starters (plus the flex, for RB/WR only).
  stack_penalty: 25.0

  # §3.7 — season points forgone by spending a pick on bench depth while a
  # starting slot is still empty.
  bench_opportunity_cost: 25.0

  # Board is stale if older than this (hours) at draft time.
  board_max_age_hours: 3

research:
  # §3.2 — ADP-ordered players to research. Not "everyone reachable" (~170 at
  # our slot): research where the decision is expensive. Picks 4-57 are rounds
  # 1-6 and the pool in reach there is ADP 1-90. Rounds 7-13 are bench flyers
  # and a kicker, where §3.7 already forbids the only genuinely bad move.
  pool_size: 80

  # Parallel `claude -p` processes. Measured 2026-09-04: 27.6s median per
  # dossier, so 80 players is ~6 min at 6 workers. Lower it if the plan's rate
  # limit is unknown — the pass resumes, so a limit hit costs a wait, not a
  # restart.
  workers: 6

  # A dossier older than this is ignored at board build. One night plus the
  # morning, no more: a stale dossier is worse than none, because it reads as
  # current.
  max_age_hours: 30

  # The post-order-lock refresh, by current VOR.
  refresh_top: 15

judge:
  # §3.10 — Pearce's gate, 2026-09-04. The budget is the SMALLER of this and
  # the observed pace, because opponents do not use their clock: 7 picks at 90s
  # is 10.5 min, but 7 picks at 20s is 2.3 min.
  max_budget_s: 300
  # Below this, skip the turn and let the math draft. A judge run that cannot
  # finish is a judge run that spends tokens for nothing.
  min_budget_s: 60
  # Fraction of (picks_until_next x observed pace) we allow ourselves.
  pace_safety: 0.5
  # Room picks the observed-pace median is taken over.
  pace_window: 8
  # The levers, hard-capped in code (core/draft/verdict.py).
  max_vetoes_per_turn: 2
  max_reorders_per_turn: 2
  # Top-N of the PickPlan the judge may act on. Anything outside is invisible.
  candidates: 15

lineup:
  # §4.2 — projected margin thresholds that switch us to floor / ceiling.
  floor_margin_pts: 12
  ceiling_margin_pts: 12
  # How much projected value we'll give up to buy the preferred variance.
  floor_max_points_sacrificed: 1.5
  ceiling_max_points_sacrificed: 2.0
  # §4.3 — bench anyone without a confirmed status this close to kickoff (minutes).
  unconfirmed_status_bench_minutes: 90

waivers:
  # This league is ROLLING PRIORITY, not FAAB (read from mSettings 2026-09-03:
  # WAIVERS_TRADITIONAL, isUsingAcquisitionBudget: False). §5.3.
  #
  # §5.3.1 — the bar a claim must clear, by the priority position we hold.
  # Units are projected points per week of improvement to a STARTING slot.
  priority_ladder:
    top:                       # positions 1-3
      max_position: 3
      min_weekly_gain: 3.0
    middle:                    # positions 4-7
      max_position: 7
      min_weekly_gain: 1.5
    bottom:                    # positions 8+
      max_position: 99
      min_weekly_gain: 0.1

  # §5.3.3 — never spend a claim this good on a one-week streamer.
  streamer_priority_floor: 3

  # §5.5 — never drop a top-N player by ROS VOR.
  never_drop_top_n: 5
  # §5.5 — keep an injured player if he returns within this many weeks
  # AND a bench spot exists. With 4 bench spots it often will not.
  keep_injured_return_within_weeks: 4

  # If this league is ever switched to FAAB, write a ladder here and delete
  # priority_ladder. Do NOT run one system's numbers through the other.
  faab_ladder: null

trades:
  # §6.1 — outgoing rate limits.
  max_proposals_per_day: 1
  max_proposals_per_week: 3
  max_open_offers_per_manager: 1
  no_repropose_days: 14
  # §6.5 — never trade a top-N asset for a package of lesser parts.
  protected_top_n: 3

  # §6.8 — the anti-fleece gauntlet on INCOMING offers.
  gauntlet:
    # §6.8.1 — minimum gain in projected ROS starting-lineup points.
    min_starting_points_gain: 8
    # §6.8.4 — an offer this soon after news on any involved player is
    # presumed information arbitrage.
    news_window_hours: 48
    # §6.8.6 — on a 1-for-many, the best incoming player must be within this
    # fraction of the outgoing player's ROS VOR.
    consolidation_tolerance: 0.10
    # §6.8.9 — never accept sooner than this after receipt (minutes).
    cooldown_minutes: 60
    # §6.8.10 — caps.
    max_accepts_per_week: 1
    same_manager_cooldown_days: 14
